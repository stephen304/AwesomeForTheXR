name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (for example, v0.2.0 or v0.2.0-rc.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      product-version: ${{ steps.version.outputs.product-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          bash .github/scripts/check-release-tag.sh
          echo "product-version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      product-version: ${{ needs.validate.outputs.product-version }}

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the tested executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AwesomePatcher.exe
          path: release-asset
          skip-decompress: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          bash .github/scripts/check-release-tag.sh
          flags=()
          if [[ "$TAG" == *-rc.* ]]; then flags+=(--prerelease); fi
          url=$(gh release create "$TAG" release-asset/AwesomePatcher.exe \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" \
            --draft --generate-notes "${flags[@]}")
          printf 'Review and publish the [draft release](%s).\n' "$url" >> "$GITHUB_STEP_SUMMARY"
